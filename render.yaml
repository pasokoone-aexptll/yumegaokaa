services:
  - type: web
    name: yumegaoka-field
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/field-gateway.mjs
    healthCheckPath: /healthz
    envVars:
      - key: STREET_ID
        value: 11111111-1111-4111-8111-111111111111
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
